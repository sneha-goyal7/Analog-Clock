<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analog clock</title>
</head>

<body>
    <div class="container">
        <div class="clock">
            
            <div id ="hour"class="hand"><i></i></div>
            <div id ="min"class="hand"><i></i></div>
            <div id ="sec"class="hand"><i></i></div>
            
            <span ><b>1</b></span>
            <span ><b>2</b></span>
            <span ><b>3</b></span>
            <span ><b>4</b></span>
            <span ><b>5</b></span>
            <span ><b>6</b></span>
            <span ><b>7</b></span>
            <span ><b>8</b></span>
            <span ><b>9</b></span>
            <span ><b>10</b></span>
            <span ><b>11</b></span>
            <span ><b>12</b></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
